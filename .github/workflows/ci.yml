name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # #15：Node 20 + 新版 undici(jsdom) 不兼容（webidl.util.markAsUncloneable 缺失）→ 与本地一致用 24
          node-version: 24

      - name: Backend install & build & unit tests
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund || npm install
          npm run build
          npx jest --runInBand --ci

      - name: Frontend install & build & unit tests
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund || npm install
          npm run build
          npx vitest run --pool=threads

      - name: Security audit (vulnerabilities)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org || true

      - name: License presence check
        run: test -f LICENSE && grep -q "CUCKOO COMMERCIAL LICENSE" LICENSE && echo "LICENSE ok" || echo "LICENSE check warning (non-fatal)"

      # 说明：E2E 需要本地 dev 服务与时间调度，示例中跳过；
      # 本地开发用 `npm run test:e2e`（frontend/ 目录）验证，需手动起服务或复用 playwright webServer。
      # Sdrop 水印校验为本地工具（tools/scripts 不入库），发布前在本机执行：
      #   node tools/scripts/sdrop-verify.mjs

  # 2026-09-14：Android 编译门禁——AGP 8 默认不生成 BuildConfig 等构建问题
  # 此前只能靠手动打包 APK 时才发现（引错 BuildConfig.DEBUG 的教训）。
  # 仅验证能编译、不发布产物：CI 构建无源码水印，且无 keystore.properties 时回退 debug 签名。
  android-build:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup JDK 21（Capacitor 7 编译目标 Java 21；AGP 8 最低 17）
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 2026-09-19：不要用 action 的默认包列表——默认含已从 Google SDK 仓库下线的 'tools'，
          # sdkmanager 会报 "Failed to find package 'tools'" 并以退出码 1 结束，门禁整体失败。
          # 只装仍存在的 platform-tools，其余（platform/build-tools）由 Gradle 按需下载。
          packages: 'platform-tools'

      - name: Frontend install & build（cap sync 需要 dist 产物）
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund || npm install
          npm run build

      - name: Cap sync
        working-directory: frontend
        run: npx cap sync android

      - name: Gradle assembleDebug（编译门禁；Vosk 模型 42MB 不入库，CI 不下载，仅编译）
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon
