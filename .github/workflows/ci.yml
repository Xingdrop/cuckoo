name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # #15：Node 20 + 新版 undici(jsdom) 不兼容（webidl.util.markAsUncloneable 缺失）→ 与本地一致用 24
          node-version: 24

      - name: Backend install & build & unit tests
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund || npm install
          npm run build
          npx jest --runInBand --ci

      - name: Frontend install & build & unit tests
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund || npm install
          npm run build
          npx vitest run --pool=threads

      - name: Security audit (vulnerabilities)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org || true

      - name: License presence check
        run: test -f LICENSE && grep -q "CUCKOO COMMERCIAL LICENSE" LICENSE && echo "LICENSE ok" || echo "LICENSE check warning (non-fatal)"

      # 说明：E2E 需要本地 dev 服务与时间调度，示例中跳过；
      # 本地开发用 `npm run test:e2e`（frontend/ 目录）验证，需手动起服务或复用 playwright webServer。
      # Sdrop 水印校验为本地工具（tools/scripts 不入库），发布前在本机执行：
      #   node tools/scripts/sdrop-verify.mjs
