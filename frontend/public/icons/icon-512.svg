<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9915F"/>
      <stop offset="1" stop-color="#F2764A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- 鸟表融合体：表盘 = 鸟的圆头 -->
  <circle cx="255.9" cy="272" r="136" fill="#FFFDF8"/>

  <!-- 尾羽（左下，两片圆角三角） -->
  <path d="M 373.9 356 Q 411.9 368 423.9 404 Q 383.9 410 353.9 386 Z" fill="#FFFFFF"/>
  <path d="M 353.9 384 Q 379.9 398 387.9 424 Q 355.9 426 335.9 404 Z" fill="#FFE1CE"/>

  <!-- 鸟嘴（右上 2 点方向，白色三角） -->
  <path d="M 139.9 196 L 69.9 214 L 129.9 250 Z" fill="#FFFFFF"/>

  <!-- 头顶呆毛（两片小叶） -->
  <path d="M 275.9 130 Q 283.9 102 261.9 94 Q 253.9 114 263.9 128 Z" fill="#FFFFFF"/>
  <path d="M 245.9 128 Q 241.9 100 217.9 96 Q 223.9 118 237.9 128 Z" fill="#FFE1CE"/>

  <!-- 表针（12:05，主题橙） -->
  <path d="M 255.9 272 L 255.9 192" stroke="#F2764A" stroke-width="22" stroke-linecap="round"/>
  <path d="M 255.9 272 L 193.9 308" stroke="#F2764A" stroke-width="22" stroke-linecap="round"/>
  <circle cx="255.9" cy="272" r="19" fill="#F2764A"/>
  <circle cx="255.9" cy="272" r="7" fill="#D95F33"/>

  <!-- 刻度（4 点） -->
  <circle cx="255.9" cy="170" r="11" fill="#F2764A" opacity=".35"/>
  <circle cx="153.9" cy="272" r="11" fill="#F2764A" opacity=".35"/>
  <circle cx="255.9" cy="374" r="11" fill="#F2764A" opacity=".35"/>
  <circle cx="357.9" cy="272" r="11" fill="#F2764A" opacity=".35"/>

  <!-- 鸟眼（右上，与喙呼应） -->
  <circle cx="189.9" cy="212" r="13" fill="#40312A"/>
  <circle cx="185.9" cy="208" r="4.5" fill="#FFFFFF"/>
</svg>
