<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9915F"/>
      <stop offset="1" stop-color="#F2764A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- 鸟表融合体：表盘 = 鸟的圆头 -->
  <circle cx="256" cy="272" r="136" fill="#FFFDF8"/>

  <!-- 尾羽（左下，两片圆角三角） -->
  <path d="M138 356 Q100 368 88 404 Q128 410 158 386 Z" fill="#FFFFFF"/>
  <path d="M158 384 Q132 398 124 424 Q156 426 176 404 Z" fill="#FFE1CE"/>

  <!-- 鸟嘴（右上 2 点方向，白色三角） -->
  <path d="M372 196 L442 214 L382 250 Z" fill="#FFFFFF"/>

  <!-- 头顶呆毛（两片小叶） -->
  <path d="M236 130 Q228 102 250 94 Q258 114 248 128 Z" fill="#FFFFFF"/>
  <path d="M266 128 Q270 100 294 96 Q288 118 274 128 Z" fill="#FFE1CE"/>

  <!-- 表针（12:05，主题橙） -->
  <path d="M256 272 L256 192" stroke="#F2764A" stroke-width="22" stroke-linecap="round"/>
  <path d="M256 272 L318 308" stroke="#F2764A" stroke-width="22" stroke-linecap="round"/>
  <circle cx="256" cy="272" r="19" fill="#F2764A"/>
  <circle cx="256" cy="272" r="7" fill="#D95F33"/>

  <!-- 刻度（4 点） -->
  <circle cx="256" cy="170" r="11" fill="#F2764A" opacity=".35"/>
  <circle cx="358" cy="272" r="11" fill="#F2764A" opacity=".35"/>
  <circle cx="256" cy="374" r="11" fill="#F2764A" opacity=".35"/>
  <circle cx="154" cy="272" r="11" fill="#F2764A" opacity=".35"/>

  <!-- 鸟眼（右上，与喙呼应） -->
  <circle cx="322" cy="212" r="13" fill="#40312A"/>
  <circle cx="326" cy="208" r="4.5" fill="#FFFFFF"/>
</svg>
